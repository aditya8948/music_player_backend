spring.application.name=backend

# MongoDB Configuration (Explicit Database: music_player_db)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/music_player_db}
spring.data.mongodb.database=music_player_db
spring.data.mongodb.auto-index-creation=true

# ZITADEL OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ZITADEL_ISSUER:https://musekit-oua2yk.us1.zitadel.cloud}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ZITADEL_JWKS_URI:https://musekit-oua2yk.us1.zitadel.cloud/oauth/v2/keys}


# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
