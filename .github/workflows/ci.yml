name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: ./mvnw clean compile --batch-mode

      - name: Run Unit Tests
        run: |
          ./mvnw test --batch-mode \
            -Dtest="SongControllerTest,SongServiceTest,PlaylistServiceTest,SongSearchServiceTest" \
            -DfailIfNoTests=false

      - name: Package JAR
        run: ./mvnw package -DskipTests --batch-mode

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          retention-days: 7

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/musekit-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/musekit-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
